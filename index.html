<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Discord Web Gateway Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0d10] text-white font-sans antialiased">
    <div class="h-screen w-full flex flex-col items-center justify-center p-4 relative overflow-hidden">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[350px] h-[350px] bg-[#5865F2]/10 rounded-full blur-[120px] pointer-events-none"></div>

        <div id="login-card" class="relative z-10 w-full max-w-md bg-[#15191e]/80 backdrop-blur-md border border-zinc-800 rounded-2xl p-8 shadow-2xl">
            <h1 class="text-xl font-bold mb-1 text-center">Đăng nhập Hệ thống</h1>
            <p class="text-xs text-zinc-400 mb-6 text-center">Xác thực Token tài khoản để cấu hình trạng thái Web</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Token Discord</label>
                    <input type="password" id="login-token" placeholder="Nhập token của bạn tại đây..." class="w-full px-4 py-3 bg-[#0b0d10] border border-zinc-800 rounded-xl text-white text-sm focus:outline-none focus:border-[#5865F2] transition-all"/>
                </div>
                <button onclick="handleLogin()" id="login-btn" class="w-full py-3 bg-[#5865F2] hover:bg-[#4752c4] font-medium rounded-xl transition-all active:scale-[0.98] text-sm cursor-pointer">
                    Xác Thực Kết Nối
                </button>
                <p id="login-error" class="text-xs text-rose-400 text-center font-medium min-h-[16px]"></p>
            </div>
        </div>

        <div id="dashboard-card" class="hidden relative z-10 w-full max-w-md bg-[#15191e]/80 backdrop-blur-md border border-zinc-800 rounded-2xl p-8 shadow-2xl flex flex-col">
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-zinc-800/60">
                <div class="flex items-center gap-3">
                    <img id="user-avatar" src="https://discord.com/favicon.ico" class="w-10 h-10 rounded-full border border-zinc-700 object-cover bg-zinc-800"/>
                    <div>
                        <div id="user-name" class="font-bold text-sm">Discord User</div>
                        <div class="text-[10px] text-emerald-400 font-medium">Trạng thái: Sẵn sàng</div>
                    </div>
                </div>
                <button onclick="handleLogout()" class="text-xs text-zinc-500 hover:text-rose-400 font-medium transition-colors cursor-pointer">Đăng xuất</button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">ID Kênh Thoại (Voice ID)</label>
                    <input type="text" id="channelId" placeholder="Nhập ID phòng thoại để treo..." class="w-full px-4 py-3 bg-[#0b0d10] border border-zinc-800 rounded-xl text-white text-sm focus:outline-none focus:border-[#5865F2] transition-all"/>
                </div>

                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button onclick="startBot()" class="py-3 bg-[#5865F2] hover:bg-[#4752c4] font-medium rounded-xl transition-all active:scale-[0.98] text-sm cursor-pointer">▶ Bật Bot</button>
                    <button onclick="stopBot()" class="py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium rounded-xl transition-all active:scale-[0.98] text-sm cursor-pointer">⏹ Tắt Bot</button>
                </div>
            </div>

            <div class="mt-6 pt-4 border-t border-zinc-800/60 flex items-center justify-center gap-2 text-sm text-amber-400 font-medium" id="status-container">
                <div class="w-2 h-2 rounded-full bg-amber-400 animate-pulse" id="status-dot"></div>
                <span id="status">Chờ kích hoạt...</span>
            </div>
        </div>
    </div>

    <script>
        let globalToken = null;
        let ws = null;
        let heartbeatInterval = null;
        let rpcInterval = null;
        let startTime = null;

        const CORS_PROXY = "https://corsproxy.io/?";
        const STREAM_URL = "https://twitch.tv/tz_016z";

        window.onload = async function() {
            const savedToken = localStorage.getItem('web_dc_token');
            const savedChannelId = localStorage.getItem('web_dc_channelId');
            if (savedChannelId) document.getElementById('channelId').value = savedChannelId;
            if (savedToken) {
                document.getElementById('login-btn').innerText = "Đang kiểm tra...";
                document.getElementById('login-btn').disabled = true;
                const ok = await checkAndLogin(savedToken);
                if (!ok) {
                    localStorage.removeItem('web_dc_token');
                    document.getElementById('login-btn').innerText = "Xác Thực Kết Nối";
                    document.getElementById('login-btn').disabled = false;
                }
            }
        };

        async function checkAndLogin(token) {
            try {
                const targetUrl = "https://discord.com/api/v9/users/@me";
                const response = await fetch(CORS_PROXY + encodeURIComponent(targetUrl), {
                    headers: { "Authorization": token.trim() }
                });
                if (!response.ok) return false;
                const user = await response.json();
                
                globalToken = token.trim();
                localStorage.setItem('web_dc_token', globalToken);

                document.getElementById('user-name').innerText = user.username;
                document.getElementById('user-avatar').src = user.avatar ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png` : `https://cdn.discordapp.com/embed/avatars/${user.discriminator % 5}.png`;
                document.getElementById('login-card').classList.add('hidden');
                document.getElementById('dashboard-card').classList.remove('hidden');
                return true;
            } catch {
                return false;
            }
        }

        async function handleLogin() {
            const val = document.getElementById('login-token').value.trim();
            if (!val) return alert("Chưa nhập token!");
            const ok = await checkAndLogin(val);
            if (!ok) document.getElementById('login-error').innerText = "Token không hợp lệ!";
        }

        function handleLogout() {
            stopBot();
            localStorage.removeItem('web_dc_token');
            globalToken = null;
            document.getElementById('dashboard-card').classList.add('hidden');
            document.getElementById('login-card').classList.remove('hidden');
        }

        function updateStatus(text, type = "warning") {
            const span = document.getElementById('status');
            const dot = document.getElementById('status-dot');
            const box = document.getElementById('status-container');
            span.innerText = text;
            if (type === "success") {
                box.className = "mt-6 pt-4 border-t border-zinc-800/60 flex items-center justify-center gap-2 text-sm text-emerald-400 font-medium";
                dot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
            } else if (type === "error") {
                box.className = "mt-6 pt-4 border-t border-zinc-800/60 flex items-center justify-center gap-2 text-sm text-rose-400 font-medium";
                dot.className = "w-2 h-2 rounded-full bg-rose-400";
            } else {
                box.className = "mt-6 pt-4 border-t border-zinc-800/60 flex items-center justify-center gap-2 text-sm text-amber-400 font-medium";
                dot.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";
            }
        }

        // Tạo cấu trúc Object thuần tương thích với Discord Gateway WebSocket
        function buildPresenceActivities() {
            const now = new Date();
            now.setHours(now.getHours() - 1); // Logic trừ 1 giờ của bạn
            const time = now.toLocaleTimeString("vi-VN", { hour12: false });
            const date = now.toLocaleDateString("vi-VN");

            return [{
                name: "tz_016z",
                type: 1, // Loại 1: Streaming (Tím)
                url: STREAM_URL,
                details: `🕒 ${time} • ${date}`,
                state: "ngu🌸",
                application_id: "1475505964131155978", // snake_case cho cổng Gateway
                timestamps: {
                    start: startTime - 3600000
                },
                assets: {
                    large_image: "classroom", // Key ảnh lưu trên Developer Portal
                    large_text: "tz_016z"
                },
                buttons: ["YouTube", "Discord"], // Mảng text của nút
                metadata: {
                    button_urls: [
                        "https://youtu.be/dQw4w9WgXcQ",
                        "https://discord.gg/JdGwZS5Xwb"
                    ] // Mảng link tương ứng
                }
            }];
        }

        function sendPresenceUpdate() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    op: 3, // Status Update payload
                    d: {
                        status: "online",
                        afk: false,
                        since: null,
                        activities: buildPresenceActivities()
                    }
                }));
            }
        }

        async function startBot() {
            const channelId = document.getElementById('channelId').value.trim();
            if (!channelId) return alert("Vui lòng nhập Voice ID!");
            if (ws) return updateStatus("Hệ thống đang chạy!", "warning");

            localStorage.setItem('web_dc_channelId', channelId);
            updateStatus("Đang kiểm tra phòng thoại...", "warning");

            try {
                const res = await fetch(CORS_PROXY + encodeURIComponent(`https://discord.com/api/v9/channels/${channelId}`), {
                    headers: { "Authorization": globalToken }
                });
                if (!res.ok) throw new Error("Không thể truy cập Voice ID!");
                const channelData = await res.json();

                updateStatus("Đang kết nối cổng Discord...", "warning");
                startTime = Date.now();
                ws = new WebSocket("wss://gateway.discord.gg/?v=9&encoding=json");

                ws.onmessage = (event) => {
                    const msg = JSON.parse(event.data);

                    if (msg.op === 10) { // Hello từ Discord Gateway
                        heartbeatInterval = setInterval(() => {
                            ws.send(JSON.stringify({ op: 1, d: null }));
                        }, msg.d.heartbeat_interval);

                        // Gửi gói lệnh IDENTIFY để Online
                        ws.send(JSON.stringify({
                            op: 2,
                            d: {
                                token: globalToken,
                                capabilities: 16381,
                                properties: { os: "Windows", browser: "Chrome", device: "" },
                                presence: {
                                    status: "online",
                                    afk: false,
                                    activities: buildPresenceActivities()
                                },
                                compress: false,
                                client_state: { guild_versions: {}, highest_last_message_id: "0", read_state_version: 0, user_guild_settings_version: -1, user_settings_version: -1, private_channels_version: "0", api_code_version: 0 }
                            }
                        }));
                    }

                    if (msg.t === "READY") {
                        // Gửi lệnh Opcode 4 để nhảy vào phòng thoại máy chủ công khai
                        ws.send(JSON.stringify({
                            op: 4,
                            d: {
                                guild_id: channelData.guild_id,
                                channel_id: channelId,
                                self_mute: true,
                                self_deaf: false
                            }
                        }));

                        // Bắt đầu chu kỳ tự động cập nhật thời gian hiển thị RPC sau mỗi 60 giây
                        rpcInterval = setInterval(sendPresenceUpdate, 60000);
                        updateStatus(`Đã treo thoại [${channelData.name || "Kênh"}] + Bật Nút RPC thành công`, "success");
                    }
                };

                ws.onclose = () => { stopBot(); updateStatus("Đã ngắt kết nối.", "error"); };
                ws.onerror = () => { stopBot(); updateStatus("Lỗi mạng WebSocket Gateway!", "error"); };

            } catch (err) {
                updateStatus(err.message, "error");
                stopBot();
            }
        }

        function stopBot() {
            if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
            if (rpcInterval) { clearInterval(rpcInterval); rpcInterval = null; }
            if (ws && ws.readyState === WebSocket.OPEN) {
                // Rời phòng thoại trước khi tắt
                ws.send(JSON.stringify({ op: 4, d: { guild_id: null, channel_id: null, self_mute: true, self_deaf: false } }));
                setTimeout(() => { if (ws) { ws.close(); ws = null; } updateStatus("Đã dừng hoạt động bot.", "error"); }, 300);
            } else {
                ws = null;
                updateStatus("Chờ kích hoạt...", "warning");
            }
        }
    </script>
</body>
</html>
